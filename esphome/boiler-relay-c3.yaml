# Minimal boiler relay: Seeed XIAO ESP32-C3 + Relay-T73 V2.1 module (SRD-03VDC, 3.3 V)
# on the boiler's room-thermostat contact. No display; HA does the control, the watchdog
# is the failsafe.
#
# Wiring (module has transistor + flyback diode on board):
#   module VCC -> 3V3, GND -> GND, IN -> D2 (GPIO4)
#   relay COM + NC -> boiler RT terminals
#   CHECK FIRST: does the boiler heat with the terminals closed (most) or open?
#     closed -> COM + NC, open -> COM + NO. Keep `inverted: true` in both cases.
# Hardware failsafe: NC is closed while the coil is unpowered, so a dead ESP, missing
# power or unflashed board = boiler demand ON (TRVs regulate). Therefore the pin is
# inverted: "Boiler" ON = coil off = contact closed; "Boiler" OFF = coil energized.
# The coil draws ~100 mA while the boiler is off (fine, continuous duty).
# Check with a multimeter on COM/NC: "Boiler" ON must read closed. If it is the other
# way round, the module is low-level triggered (H/L jumper) -> set `inverted: false`.
# Avoid GPIO2/8/9 (strapping pins) for the relay.
# Bare SRD-03VDC without module: add NPN (2N2222/BC337) + 1 kΩ base resistor + 1N4148
# across the coil; a GPIO cannot drive the ~120 mA coil directly.

substitutions:
  node_name: boiler-relay
  name: Boiler Relay
  relay_pin: GPIO4  # XIAO D2

esphome:
  name: ${node_name}
  friendly_name: ${name}

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

packages:
  watchdog: !include
    file: boiler-watchdog.yaml
    vars:
      relay_id: boiler_relay
      failsafe_minutes: "10"

logger:

api:
  encryption:
    key: !secret boiler_relay_api_key

ota:
  - platform: esphome
    password: !secret boiler_relay_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Boiler-Relay"
    password: !secret boiler_relay_ap_password

captive_portal:

switch:
  - platform: gpio
    id: boiler_relay
    name: "Boiler"
    icon: mdi:water-boiler
    pin:
      number: ${relay_pin}
      inverted: true  # COM+NC wiring: coil off = boiler on
    # Boiler must not stay off after a reboot/power cut; HA turns it off again if not needed.
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: status
    name: "Status"
