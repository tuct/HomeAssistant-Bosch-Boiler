# Optional 1.8" TFT (ST7735, 128x160, SPI) with an LVGL UI for the boiler relay node.
# Looks like the Boiler Demand dashboard card (same Material Design icons).
#   Status page: flame badge + boiler state, controller status, demand, max valve opening,
#                rooms (count / calling for heat / offline), average room temperature.
#   Bottom bar:  time (left), WiFi + Home Assistant icons (right; grey blinking while
#                connecting, white when connected), amber with FAILSAFE when it engages.
#                Shown on the status and room pages, hidden in the menu.
#   Room page:   one room at a time (name, n/N, temperature, valve bar, role). The room list
#                comes from Home Assistant at runtime (attribute `rooms` of the status
#                sensor), so new rooms show up without reflashing.
#   Menu page:   Automatic on/off (if allow_automatic_toggle is "true").
# Navigation needs an input device, e.g. boiler-rotary.yaml: turn = Status -> room 1 -> ...
# -> Status, press = menu. Without one, the status page is shown.
# Language: English by default, `language: de` for German.
#
# Include with (pins below are for the Seeed XIAO ESP32-C3):
#   packages:
#     tft: !include
#       file: boiler-tft-st7735.yaml
#       vars:
#         relay_id: boiler_relay
#         language: en   # or de
#
# Wiring (XIAO ESP32-C3 -> TFT):
#   D8 (GPIO8)  -> SCK / SCL     D10 (GPIO10) -> SDA / MOSI
#   D1 (GPIO3)  -> CS            D3 (GPIO5)   -> DC / A0
#   D6 (GPIO21) -> RES / RST     BL / BLK / LED -> 3V3 (PWM dimming flickers)
#   VCC -> 3V3, GND -> GND
# Power: feed TFT VCC/BL and the relay module from an MP1584 buck converter set to 3.3 V
# (common GND with the XIAO). On the XIAO's own 3V3 the backlight dims while the relay is on.
# Panel variants differ: if the picture is shifted by a few pixels, add
#   dimensions: {width: 128, height: 160, offset_width: 2, offset_height: 1}
# if red/blue are swapped use `color_order: rgb`, if colours are negative `invert_colors: true`.
# The Automatic switch needs the ESPHome device option "Allow the device to perform Home
# Assistant actions"; without it the switch flips back to the real state after a moment.

defaults:
  tft_sck_pin: GPIO8
  tft_mosi_pin: GPIO10
  tft_cs_pin: GPIO3
  tft_dc_pin: GPIO5
  tft_reset_pin: GPIO21
  language: en
  status_entity: sensor.heating_status
  demand_entity: binary_sensor.heating_heat_demand
  max_valve_entity: sensor.heating_max_valve_opening
  automatic_entity: switch.heating_automatic_control
  allow_automatic_toggle: "true"
  failsafe_minutes: "10"
  home_timeout: 30s  # idle time before menu / room page returns to the status page

json:

globals:
  - id: ui_de  # German texts (language: de)
    type: bool
    initial_value: "false"
  - id: ui_rooms_json
    type: std::string
    initial_value: '"[]"'
  - id: ui_room_count
    type: int
    initial_value: "0"
  # Summary for the status page: rooms calling for heat (demand/holding), offline, avg temp
  - id: ui_rooms_calling
    type: int
    initial_value: "0"
  - id: ui_rooms_offline
    type: int
    initial_value: "0"
  - id: ui_rooms_avg_temp
    type: float
    initial_value: "NAN"
  # -1 = status page, 0..N-1 = room shown on the room page
  - id: ui_room_index
    type: int
    initial_value: "-1"
  - id: ui_menu_open
    type: bool
    initial_value: "false"
  # Set by an input package (boiler-rotary.yaml); used to switch input groups.
  - id: ui_indev
    type: lv_indev_t *
    initial_value: "nullptr"
  - id: ui_menu_group
    type: lv_group_t *
    initial_value: "nullptr"
  # Current room, filled by ui_show_current
  - id: ui_room_name
    type: std::string
  - id: ui_room_temp
    type: std::string
  - id: ui_room_valve
    type: int
    initial_value: "-1"
  - id: ui_room_role
    type: std::string
  # Toggles every 500 ms; connection icons blink with it while not connected.
  - id: ui_blink
    type: bool
    initial_value: "false"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(ui_de) = std::string("${language}") == "de";
            // Menu widgets get their own input group, so the encoder never reaches them
            // from the status/room pages (and vice versa).
            id(ui_menu_group) = lv_group_create();
            lv_group_add_obj(id(ui_menu_group), id(sw_auto));
            lv_group_add_obj(id(ui_menu_group), id(btn_back));
        # Static texts in the chosen language
        - lvgl.label.update:
            id: lbl_menu_title
            text: !lambda |-
              return std::string(id(ui_de) ? "Menü" : "Menu");
        - lvgl.label.update:
            id: lbl_menu_auto
            text: !lambda |-
              return std::string(id(ui_de) ? "Automatik" : "Automatic");
        - lvgl.label.update:
            id: lbl_menu_hint
            text: !lambda |-
              return std::string(id(ui_de) ? "Aus = Therme manuell / Notbetrieb" : "Off = boiler manual / failsafe");

spi:
  clk_pin:
    number: ${tft_sck_pin}
    ignore_strapping_warning: true  # GPIO8: fine as SPI clock
  mosi_pin: ${tft_mosi_pin}

time:
  - platform: homeassistant
    id: tft_time

text_sensor:
  - platform: homeassistant
    id: tft_ha_status
    entity_id: ${status_entity}
    internal: true
  - platform: homeassistant
    id: tft_ha_rooms
    entity_id: ${status_entity}
    attribute: rooms
    internal: true
    on_value:
      - lambda: |-
          id(ui_rooms_json) = x;
          JsonDocument doc = json::parse_json(x);
          JsonArray rooms = doc.as<JsonArray>();
          id(ui_room_count) = rooms.isNull() ? 0 : rooms.size();
          int calling = 0, offline = 0, temps = 0;
          float sum = 0;
          for (JsonObject r : rooms) {
            const char *role = r["r"] | "o";
            if (role[0] == 'd' || role[0] == 'h') calling++;
            if (role[0] == 'o') offline++;
            if (!r["t"].isNull()) { sum += r["t"].as<float>(); temps++; }
          }
          id(ui_rooms_calling) = calling;
          id(ui_rooms_offline) = offline;
          id(ui_rooms_avg_temp) = temps ? sum / temps : NAN;
      - if:
          condition:
            lambda: return id(ui_room_index) >= 0 && !id(ui_menu_open);
          then:
            - script.execute: ui_show_current

binary_sensor:
  - platform: homeassistant
    id: tft_ha_automatic
    entity_id: ${automatic_entity}
    internal: true
    on_state:
      - lvgl.widget.update:
          id: sw_auto
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: tft_ha_demand
    entity_id: ${demand_entity}
    internal: true

sensor:
  - platform: homeassistant
    id: tft_ha_max_valve
    entity_id: ${max_valve_entity}
    internal: true

font:
  - file: "gfonts://Roboto@700"
    id: tft_font_big
    size: 30
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true  # only combining accents, not used
  - file: "gfonts://Roboto@700"
    id: tft_font_title
    size: 20
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto"
    id: tft_font
    size: 14
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto"
    id: tft_font_small
    size: 11
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto"
    id: tft_font_bar
    size: 13
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Material Design Icons, same as the Home Assistant card.
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_bar
    size: 16
    glyphs:
      - "\U000F05A9"  # wifi
      - "\U000F07D0"  # home-assistant
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_big
    size: 26
    glyphs:
      - "\U000F0238"  # fire
      - "\U000F1722"  # fire-off
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_small
    size: 14
    glyphs:
      - "\U000F050F"  # thermometer
      - "\U000F1066"  # valve
      - "\U000F06A9"  # robot
      - "\U000F07D0"  # home-assistant
      - "\U000F0026"  # alert
      - "\U000F05A9"  # wifi

display:
  - platform: mipi_spi
    model: ST7735
    id: tft
    cs_pin: ${tft_cs_pin}
    dc_pin: ${tft_dc_pin}
    reset_pin: ${tft_reset_pin}
    auto_clear_enabled: false
    update_interval: never

script:
  # Navigation (called by the input package): Status -> room 1 -> ... -> room N -> Status
  - id: ui_nav_next
    then:
      - lambda: |-
          if (id(ui_room_count) == 0) { id(ui_room_index) = -1; return; }
          id(ui_room_index) = id(ui_room_index) + 1 >= id(ui_room_count) ? -1 : id(ui_room_index) + 1;
      - script.execute: ui_show_current
  - id: ui_nav_prev
    then:
      - lambda: |-
          if (id(ui_room_count) == 0) { id(ui_room_index) = -1; return; }
          id(ui_room_index) = id(ui_room_index) <= -1 ? id(ui_room_count) - 1 : id(ui_room_index) - 1;
      - script.execute: ui_show_current

  - id: ui_show_current
    then:
      - lambda: |-
          JsonDocument doc = json::parse_json(id(ui_rooms_json));
          JsonArray rooms = doc.as<JsonArray>();
          id(ui_room_count) = rooms.isNull() ? 0 : rooms.size();
          if (id(ui_room_index) >= id(ui_room_count)) id(ui_room_index) = id(ui_room_count) - 1;
          if (id(ui_room_index) < 0) return;
          JsonObject r = rooms[id(ui_room_index)];
          id(ui_room_name) = r["n"] | "?";
          char buf[16];
          if (r["t"].isNull()) id(ui_room_temp) = "–";
          else { snprintf(buf, sizeof(buf), "%.1f°", r["t"].as<float>()); id(ui_room_temp) = buf; }
          id(ui_room_valve) = r["v"].isNull() ? -1 : r["v"].as<int>();
          id(ui_room_role) = r["r"] | "o";
      - if:
          condition:
            lambda: return id(ui_room_index) < 0;
          then:
            - lvgl.page.show: page_main
          else:
            - lvgl.label.update:
                id: lbl_room_name
                text: !lambda return id(ui_room_name);
            - lvgl.label.update:
                id: lbl_room_idx
                text: !lambda |-
                  char buf[24];  // fits any two ints, no -Wformat-truncation
                  snprintf(buf, sizeof(buf), "%d/%d", id(ui_room_index) + 1, id(ui_room_count));
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_room_temp
                text: !lambda return id(ui_room_temp);
            - lvgl.bar.update:
                id: bar_room
                value: !lambda return std::max(0, id(ui_room_valve));
                indicator:
                  bg_color: !lambda |-
                    const std::string &r = id(ui_room_role);
                    return r == "d" ? lv_color_hex(0xFF8100) : r == "h" ? lv_color_hex(0x9A5A1E) : lv_color_hex(0x6F6F6F);
            - lvgl.label.update:
                id: lbl_room_valve
                text: !lambda |-
                  if (id(ui_room_valve) < 0) return std::string(id(ui_de) ? "Ventil offline" : "Valve offline");
                  char buf[24];
                  snprintf(buf, sizeof(buf), id(ui_de) ? "Ventil %d %%" : "Valve %d %%", id(ui_room_valve));
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_room_role
                text: !lambda |-
                  const std::string &r = id(ui_room_role);
                  if (id(ui_de))
                    return std::string(r == "d" ? "fordert Wärme an" : r == "h" ? "hält Therme an" : r == "c" ? "zu" : "keine Daten");
                  return std::string(r == "d" ? "calling for heat" : r == "h" ? "keeping boiler on" : r == "c" ? "closed" : "no data");
                text_color: !lambda |-
                  const std::string &r = id(ui_room_role);
                  return r == "d" ? lv_color_hex(0xFF8100) : r == "o" ? lv_color_hex(0xF5A623) : lv_color_hex(0x8B8D98);
            - lvgl.page.show: page_room

  - id: ui_show_menu
    then:
      - script.execute: ui_open_menu

  - id: ui_open_menu
    then:
      - if:
          condition:
            lambda: return ${allow_automatic_toggle};
          then:
            - lambda: |-
                id(ui_menu_open) = true;
                if (id(ui_indev) != nullptr) lv_indev_set_group(id(ui_indev), id(ui_menu_group));
            - lvgl.widget.update:
                id: sw_auto
                state:
                  checked: !lambda return id(tft_ha_automatic).state;
            - lvgl.widget.hide: bottom_bar
            - lvgl.page.show: page_menu

  - id: ui_show_status
    then:
      - lambda: |-
          id(ui_menu_open) = false;
          id(ui_room_index) = -1;
          if (id(ui_indev) != nullptr) lv_indev_set_group(id(ui_indev), lv_group_get_default());
      - lvgl.widget.show: bottom_bar
      - lvgl.page.show: page_main

  # After toggling, show the real HA state again (covers "actions not allowed").
  - id: ui_sync_automatic
    mode: restart
    then:
      - delay: 3s
      - lvgl.widget.update:
          id: sw_auto
          state:
            checked: !lambda return id(tft_ha_automatic).state;

# Refresh the status page.
interval:
  - interval: 1s
    then:
      # Flame badge + boiler line (like the card)
      - lvgl.widget.update:
          id: badge
          bg_color: !lambda |-
            return id(${relay_id}).state ? lv_color_hex(0x3D2410) : lv_color_hex(0x282828);
      - lvgl.label.update:
          id: lbl_flame
          text: !lambda |-
            return std::string(id(${relay_id}).state ? "\U000F0238" : "\U000F1722");
          text_color: !lambda |-
            return id(${relay_id}).state ? lv_color_hex(0xFF8100) : lv_color_hex(0x6F6F6F);
      - lvgl.label.update:
          id: lbl_boiler
          text: !lambda |-
            const bool on = id(${relay_id}).state;
            return std::string(id(ui_de) ? (on ? "Heizt" : "Aus") : (on ? "Heating" : "Off"));
          y: !lambda |-
            // Centre on the 40 px badge (y 8..48); move up when a status line is shown.
            const std::string s = id(tft_ha_status).has_state() ? id(tft_ha_status).state : "";
            const bool on = id(${relay_id}).state;
            const bool no_status = s.empty() || (on && s == "heating") || (!on && s == "idle");
            return no_status ? 16 : 10;
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            if (!id(tft_ha_status).has_state()) return std::string("");
            const std::string s = id(tft_ha_status).state;
            const bool on = id(${relay_id}).state;
            // "Heating"/"Idle" just repeat the boiler line (same rule as the card).
            if ((on && s == "heating") || (!on && s == "idle")) return std::string("");
            const bool de = id(ui_de);
            if (s == "idle") return std::string(de ? "Bereit" : "Idle");
            if (s == "heating") return std::string(de ? "Wärmeanforderung" : "Heating");
            if (s == "waiting_min_on") return std::string(de ? "Mindestlaufzeit" : "Minimum on time");
            if (s == "waiting_min_off") return std::string(de ? "Mindestpause" : "Minimum off time");
            if (s == "valves_offline") return std::string(de ? "Ventile offline" : "Valves offline");
            if (s == "failsafe") return std::string(de ? "Notbetrieb aktiv" : "Failsafe active");
            if (s == "switch_unavailable") return std::string(de ? "Schalter fehlt" : "Switch unavailable");
            if (s == "disabled") return std::string(de ? "Automatik aus" : "Automatic off");
            return s;
          text_color: !lambda |-
            const std::string s = id(tft_ha_status).state;
            return (s == "failsafe" || s == "valves_offline") ? lv_color_hex(0xF5A623) : lv_color_hex(0x8B8D98);
      # Row 1: demand dot + text | rooms calling/total
      - lvgl.widget.update:
          id: dot_demand
          bg_color: !lambda |-
            return id(tft_ha_demand).state ? lv_color_hex(0xFF8100) : lv_color_hex(0x6F6F6F);
      - lvgl.label.update:
          id: lbl_demand
          text: !lambda |-
            const bool d = id(tft_ha_demand).state;
            return std::string(id(ui_de) ? (d ? "Anforderung" : "Keine Anf.") : (d ? "Demand" : "No demand"));
      - lvgl.label.update:
          id: lbl_valve
          text: !lambda |-
            const float v = id(tft_ha_max_valve).state;
            char buf[32];
            if (id(tft_ha_max_valve).has_state() && !std::isnan(v))
              snprintf(buf, sizeof(buf), id(ui_de) ? "max. Ventil %.0f %%" : "max valve %.0f %%", v);
            else
              snprintf(buf, sizeof(buf), "%s", id(ui_de) ? "max. Ventil –" : "max valve –");
            return std::string(buf);
      # Row 2: average temperature | max valve
      - lvgl.label.update:
          id: lbl_rooms
          text: !lambda |-
            // calling for heat / total, e.g. "2/3 rooms"; amber if a room is offline
            const int n = id(ui_room_count);
            const bool de = id(ui_de);
            if (n == 0) return std::string(de ? "keine Räume" : "no rooms");
            char buf[32];
            snprintf(buf, sizeof(buf), "%d/%d %s", id(ui_rooms_calling), n,
                     de ? (n == 1 ? "Raum" : "Räume") : (n == 1 ? "room" : "rooms"));
            return std::string(buf);
          text_color: !lambda |-
            return id(ui_rooms_offline) > 0 ? lv_color_hex(0xF5A623) : lv_color_hex(0x8B8D98);
      - lvgl.label.update:
          id: lbl_avg
          text: !lambda |-
            const float t = id(ui_rooms_avg_temp);
            if (std::isnan(t)) return std::string("");
            char buf[20];
            snprintf(buf, sizeof(buf), id(ui_de) ? "Ø %.1f°" : "avg %.1f°", t);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto now = id(tft_time).now();
            return now.is_valid() ? now.strftime("%H:%M") : std::string("--:--");
      # Bottom bar: amber with FAILSAFE when the watchdog switched the boiler on
      - lvgl.widget.update:
          id: bottom_bar
          bg_opa: !lambda |-
            return id(boiler_watchdog_minutes_without_ha) >= ${failsafe_minutes} ? LV_OPA_COVER : LV_OPA_TRANSP;
      - lvgl.label.update:
          id: lbl_failsafe
          text: !lambda |-
            return std::string(id(boiler_watchdog_minutes_without_ha) >= ${failsafe_minutes} ? "FAILSAFE" : "");
      - lvgl.label.update:
          id: lbl_time
          text_color: !lambda |-
            return id(boiler_watchdog_minutes_without_ha) >= ${failsafe_minutes} ? lv_color_hex(0x000000) : lv_color_hex(0x8B8D98);

  # Connection icons: white = connected, grey blinking = connecting.
  - interval: 500ms
    then:
      - lambda: id(ui_blink) = !id(ui_blink);
      - lvgl.label.update:
          id: lbl_wifi
          text_color: !lambda |-
            const bool fs = id(boiler_watchdog_minutes_without_ha) >= ${failsafe_minutes};
            if (wifi::global_wifi_component->is_connected()) return fs ? lv_color_hex(0x000000) : lv_color_hex(0xFFFFFF);
            return id(ui_blink) ? lv_color_hex(0x6F6F6F) : lv_color_hex(0x2A2A2A);
      - lvgl.label.update:
          id: lbl_ha
          text_color: !lambda |-
            const bool fs = id(boiler_watchdog_minutes_without_ha) >= ${failsafe_minutes};
            if (api::global_api_server->is_connected_with_state_subscription())
              return fs ? lv_color_hex(0x000000) : lv_color_hex(0xFFFFFF);
            return id(ui_blink) ? lv_color_hex(0x6F6F6F) : lv_color_hex(0x2A2A2A);

lvgl:
  displays: [tft]
  rotation: 90  # landscape 160x128
  buffer_size: 25%
  bg_color: 0x000000
  text_font: tft_font
  text_color: 0xFFFFFF
  on_idle:
    - timeout: ${home_timeout}
      then:
        - if:
            condition:
              lambda: return id(ui_menu_open) || id(ui_room_index) >= 0;
            then:
              - script.execute: ui_show_status
  style_definitions:
    - id: st_focus
      outline_width: 2
      outline_color: 0xF5A623
      outline_pad: 1
    # Invisible full-screen buttons: catch the encoder press on status/room pages.
    - id: st_invisible
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      outline_width: 0
    - id: st_small_grey
      text_font: tft_font_small
      text_color: 0x8B8D98
  top_layer:
    widgets:
      - obj:
          id: bottom_bar
          align: BOTTOM_MID
          width: 160
          height: 20
          radius: 0
          border_width: 0
          pad_all: 0
          bg_color: 0xF5A623
          bg_opa: TRANSP
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: lbl_time
                align: LEFT_MID
                x: 6
                text_font: tft_font_bar
                text_color: 0x8B8D98
                text: "--:--"
            - label:
                id: lbl_failsafe
                align: CENTER
                text_font: tft_font_bar
                text_color: 0x000000
                text: ""
            - label:
                id: lbl_wifi
                align: RIGHT_MID
                x: -26
                text_font: mdi_bar
                text_color: 0x6F6F6F
                text: "\U000F05A9"
            - label:
                id: lbl_ha
                align: RIGHT_MID
                x: -6
                text_font: mdi_bar
                text_color: 0x6F6F6F
                text: "\U000F07D0"
  pages:
    - id: page_main
      bg_color: 0x000000
      widgets:
        - button:
            id: btn_status_menu
            styles: st_invisible
            x: 0
            y: 0
            width: 160
            height: 128
            focused:
              outline_width: 0
            focus_key:
              outline_width: 0
            on_click:
              - script.execute: ui_show_menu
        # Flame badge
        - obj:
            id: badge
            x: 6
            y: 8
            width: 40
            height: 40
            radius: 20
            border_width: 0
            pad_all: 0
